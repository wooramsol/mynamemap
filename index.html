<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mynamemap · 길로 쓴 내 이름</title>
  <meta name="description" content="이름을 입력하면 지도 속 길 모양에서 한글 자모를 찾아 내 이름을 만들어 줍니다.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside id="panel">
    <header>
      <h1>mynamemap</h1>
      <p class="sub">내 이름 글자 모양 그대로 생긴 길을 지도에서 찾아요</p>
    </header>

    <div class="tabs">
      <button type="button" class="tab on" data-mode="nation">전국</button>
      <button type="button" class="tab" data-mode="local">지금 보는 지역</button>
    </div>
    <form id="search">
      <input id="name" type="text" value="정우람솔" maxlength="8" placeholder="이름 입력" autocomplete="off">
      <button type="submit" id="go">전국에서 찾기</button>
    </form>
    <label class="opt" id="foot-wrap"><input type="checkbox" id="foot"> 보행로·산책로도 포함</label>
    <p id="status" class="status"></p>

    <section id="card-wrap" hidden>
      <div id="card"></div>
      <button id="save" class="ghost">이미지로 저장</button>
    </section>

    <section id="jamo-list"></section>

    <footer>
      도로 데이터 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> 기여자 ·
      <a href="https://github.com/wooramsol/mynamemap" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </aside>
  <main id="map"></main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
